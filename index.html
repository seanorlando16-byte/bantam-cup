  a{color:inherit;}
  h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:0.02em;text-wrap:balance;margin:0;}
  .tnum{font-variant-numeric:tabular-nums;}
  #app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding-bottom:96px;}

  /* header */
  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    display:flex;align-items:center;gap:12px;
    padding:14px 2px 12px;
    background:linear-gradient(180deg, var(--navy-deep) 70%, rgba(6,18,36,0));
    margin:0 -16px;padding-left:16px;padding-right:16px;
  }
  .crest{width:40px;height:45px;flex:none;object-fit:contain;}
  .brand{flex:1;min-width:0;}
  .brand .name{font-family:var(--font-display);font-size:20px;color:var(--gold-bright);letter-spacing:0.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .sub{font-size:11px;color:var(--ice-dim);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
  .badge-est{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;
    border:1px solid var(--line-on-dark);color:var(--gold-bright);
    padding:4px 8px;border-radius:100px;white-space:nowrap;
    background:rgba(201,169,97,0.08);
  }

  /* bottom nav */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;justify-content:center;
    background:linear-gradient(0deg, var(--navy-deep) 60%, rgba(6,18,36,0));
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  nav.tabs .row{
    display:flex;gap:2px;width:100%;max-width:920px;margin:0 16px;
    background:var(--navy);border:1px solid var(--line-on-dark);border-radius:16px;
    padding:6px;margin-bottom:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  nav.tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--ice-dim);font-family:var(--font-body);
    font-size:10px;letter-spacing:0.04em;text-transform:uppercase;
    padding:8px 2px 7px;border-radius:11px;cursor:pointer;
  }
  nav.tabs button .ic{font-size:17px;line-height:1;}
  nav.tabs button.active{background:rgba(201,169,97,0.14);color:var(--gold-bright);}

  /* generic */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px;position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(28,37,54,0.06);
  }
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;}
  .pill{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;
    padding:4px 9px;border-radius:100px;border:1px solid var(--line);white-space:nowrap;
  }
  .pill.live{background:rgba(224,51,74,0.14);color:var(--red);border-color:rgba(224,51,74,0.4);}
  .pill.live .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:5px;box-shadow:0 0 8px var(--red);animation:pulse 1.4s infinite;}
  .pill.upcoming{color:var(--ink-dim);}
  .pill.completed{background:rgba(31,138,92,0.14);color:var(--green);border-color:rgba(31,138,92,0.35);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-dim);margin:26px 0 10px;}
  .section-label:first-of-type{margin-top:6px;}
  button.plain{font-family:var(--font-body);}

  /* SCOREBOARD PAGE */
  /* The one place a bold, full-color photo earns its keep: this is just a
     score display (huge tabular numbers, no body text to compete with), so
     a real hole photo behind it reads as an intentional hero rather than
     visual noise. A navy gradient sits on top of the photo itself (not a
     separate overlay element) so it dims progressively toward the bottom,
     where the thermometer/clock text needs the most contrast, while the
     sunset glow stays visible up top behind the event line. */
  .board{

  }
  .board .event-line{text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:14px;}
  .scoreline{display:flex;align-items:stretch;gap:10px;}
  .teambox{flex:1;text-align:center;padding:6px 4px;}
  .teambox .tname{font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ice-dim);font-family:var(--font-mono);}
  .teambox .tscore{font-family:var(--font-display);font-size:64px;line-height:1;margin-top:4px;}
  .teambox.a .tscore{color:var(--a-color);text-shadow:0 0 26px rgba(90,169,230,0.45);}
  .teambox.b .tscore{color:var(--gold-bright);text-shadow:0 0 26px rgba(201,169,97,0.45);}
  .vs-mid{width:1px;background:var(--line-on-dark);align-self:stretch;margin:6px 0;}
  .clock{text-align:center;margin-top:14px;font-family:var(--font-mono);font-size:11px;color:var(--ice-dim);letter-spacing:0.08em;}
  .clock b{color:var(--ice);}
  .thermo{height:14px;border-radius:100px;background:var(--navy-deep);border:1px solid var(--line-on-dark);margin-top:10px;overflow:hidden;display:flex;position:relative;}
  .thermo .segA{background:linear-gradient(90deg,#3d7fb0,var(--a-color));height:100%;}
  .thermo .segB{background:linear-gradient(270deg,#8a6f2e,var(--gold-bright));height:100%;margin-left:auto;}
  .thermo .mid-tick{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,0.5);}
  .goal-light{
    margin-top:14px;text-align:center;font-family:var(--font-display);font-size:15px;letter-spacing:0.06em;
    color:var(--navy-deep);background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    border-radius:10px;padding:9px;box-shadow:0 0 24px rgba(232,207,143,0.55);
  }

  /* BY ROUND (live scores live here now) */
  .round-block{display:flex;flex-direction:column;gap:10px;}
  .round-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;row-gap:4px;column-gap:10px;padding:2px 4px;}
  .round-header .rtitle{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.05em;}
  .round-header .rtitle b{color:var(--gold-text);}
  .round-header .rscore-mini{font-family:var(--font-display);font-size:20px;flex:none;}
  .round-header .rscore-mini .a{color:var(--a-text);}
  .round-header .rscore-mini .sep{color:var(--ink-dim);font-size:14px;margin:0 4px;}
  .round-header .rscore-mini .b{color:var(--gold-text);}

  /* TEAMS */
  .teamhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .teamhead .swatch{width:14px;height:28px;border-radius:3px;}
  .teamhead .swatch.a{background:linear-gradient(180deg,var(--a-color),#3d7fb0);}
  .teamhead .swatch.b{background:linear-gradient(180deg,var(--gold-bright),var(--gold));}
  .roster{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .jersey{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;
    display:flex;align-items:center;gap:10px;
  }
  .jersey .num{
    font-family:var(--font-display);font-size:22px;width:38px;height:38px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .jersey.a .num{background:rgba(90,169,230,0.18);color:var(--a-text);border:1px solid rgba(90,169,230,0.4);}
  .jersey.b .num{background:rgba(201,169,97,0.18);color:var(--gold-text);border:1px solid rgba(201,169,97,0.4);}
  .jersey .pname{font-size:14px;font-weight:600;}

<body>

<div id="bg-watermark"></div>
<div id="app"></div>
<div id="toast-holder"></div>

<script>
(function(){
"use strict";

/* ---------- handicap math ----------
   Match-play handicap allocation (USGA/WHS): strokes are figured PER MATCH,
   not against the whole field. Take every player teeing it up in that one
   match, find the lowest Course Handicap among just them, and that player
   plays off scratch; everyone else in the SAME match gets the difference
   between their handicap and that low player's. Those strokes are then
   taken on the holes ranked hardest by the course's Stroke Index (SI 1 is
   the hardest hole, so a player getting 6 strokes takes them on SI 1-6).

   Ryder Cup-style allowance: four-ball (best ball) is played at 90% of
   Course Handicap — each player's handicap is reduced to 90% and rounded
   *before* comparing to find the match's low man, not after (so the low
   man is whoever has the lowest ROUNDED 90% value, which can differ from
   whoever had the lowest raw handicap). Singles is untouched: 100% of raw
   Course Handicap, rounding only the final low-man difference, exactly as
   before this allowance existed. */
function matchIsReduced_(match){
  return !!(match && match.type==='bestball');
}
function matchLowHandicap(match, cfg){
  var players = (match.teamA||[]).concat(match.teamB||[]);
  var hcps = players.map(function(p){ return cfg.handicaps && cfg.handicaps[p]; })
    .filter(function(h){ return typeof h==='number' && !isNaN(h); });
  if(hcps.length < players.length || !players.length) return null;
  if(!matchIsReduced_(match)) return Math.min.apply(null, hcps);
  var adjusted = hcps.map(function(h){ return Math.round(h*0.9); });
  return Math.min.apply(null, adjusted);
}
function playerStrokes(player, cfg, lowHcp, match){
  if(lowHcp===null) return 0;
  var h = cfg.handicaps && cfg.handicaps[player];
  if(typeof h!=='number' || isNaN(h)) return 0;
  if(!matchIsReduced_(match)) return Math.max(0, Math.round(h - lowHcp));
  return Math.max(0, Math.round(h*0.9) - lowHcp);
}
function strokesOnHole(strokesTotal, strokeIndex){
  if(!strokeIndex || !strokesTotal) return 0;
  var extra = Math.floor((strokesTotal-1)/18);
  var rem = ((strokesTotal-1) % 18) + 1;
  return extra + (strokeIndex<=rem ? 1 : 0);
}
function emptyHoles(){ var o={}; for(var i=1;i<=18;i++) o[String(i)] = {number:i, scores:{}}; return o; }
function holeYardage(course, holeIndex){
  var h = course && course.holes && course.holes[holeIndex];
  if(!h) return null;
  var tee = course.displayTee || (course.tees && course.tees[0]);
  return (h.yardages && h.yardages[tee]) || null;
}

/* ---------- match play math (best ball, scored hole-by-hole) ---------- */
// One side's net scores for a hole (best-ball or singles — a singles side
// is just a team of one). Returns null if that side hasn't fully entered
// gross scores for this hole yet; does NOT require the other side to be
// done, so a team's best-ball number can show as soon as its own players
// are in, independent of how the other team is doing.
function sideNetScores(match, side, i){
  var team = side==='A' ? (match.teamA||[]) : (match.teamB||[]);
  if(!team.length) return null;
  var h = match.holes && match.holes[String(i+1)];
  var scores = (h && h.scores) || {};
  var gross = team.map(function(p){ return scores[p]; });
  if(gross.some(function(v){ return typeof v!=='number' || v<=0; })) return null;

  var cfg = live.config;
  var lowHcp = matchLowHandicap(match, cfg);
  var course = live.courses[match.courseId];
  var strokeIndex = course && course.holes && course.holes[i] && course.holes[i].strokeIndex;
  var usingHandicap = lowHcp!==null && !!strokeIndex;

  function net(p){
    var g = scores[p];
    if(!usingHandicap) return g;
    return g - strokesOnHole(playerStrokes(p, cfg, lowHcp, match), strokeIndex);
  }

  return { vals: team.map(net), usingHandicap: usingHandicap };
}
// A team's best-ball (lowest net) score for one hole — the number shown on
// the scorecard strip. Independent per side; null until that side's own
// players have all entered a score for the hole.
function teamHoleBest(match, side, i){
  var s = sideNetScores(match, side, i);
  if(!s) return null;
  return { best: Math.min.apply(null, s.vals), usingHandicap: s.usingHandicap };
}
function holeOutcome(match, i){
  var teamA = match.teamA||[], teamB = match.teamB||[];
  if(!teamA.length || !teamB.length) return null;
  var h = match.holes && match.holes[String(i+1)];
  var scores = (h && h.scores) || {};
  var aGross = teamA.map(function(p){ return scores[p]; }).filter(function(v){ return typeof v==='number' && v>0; });
  var bGross = teamB.map(function(p){ return scores[p]; }).filter(function(v){ return typeof v==='number' && v>0; });
  if(aGross.length < teamA.length || bGross.length < teamB.length) return null;

  var cfg = live.config;
  var lowHcp = matchLowHandicap(match, cfg);
  var course = live.courses[match.courseId];
  var strokeIndex = course && course.holes && course.holes[i] && course.holes[i].strokeIndex;
  var usingHandicap = lowHcp!==null && !!strokeIndex;

  function net(p){
    var g = scores[p];
    if(!usingHandicap) return g;
    return g - strokesOnHole(playerStrokes(p, cfg, lowHcp, match), strokeIndex);
  }

  var aVals = teamA.map(net), bVals = teamB.map(net);
  var aBest = Math.min.apply(null, aVals);
  var bBest = Math.min.apply(null, bVals);
  var winner = aBest<bBest ? 'A' : bBest<aBest ? 'B' : 'AS';
  return { aBest:aBest, bBest:bBest, winner:winner, usingHandicap:usingHandicap };
}

function computeMatch(match){
  var diff=0, thru=0, closed=false;
  for(var i=0;i<18;i++){
    var outcome = holeOutcome(match, i);
    if(!outcome) break;
    thru = i+1;
    if(outcome.winner==='A') diff++;
    else if(outcome.winner==='B') diff--;
    var remaining = 18 - thru;
    if(Math.abs(diff) > remaining){ closed = true; break; }
  }
  var remaining = 18 - thru;
  var finished = closed || thru===18;
  var pointsA=0, pointsB=0, label='', state='upcoming';
  if(!(match.teamA&&match.teamA.length) || !(match.teamB&&match.teamB.length)){
    label='Pairings TBD'; state='upcoming';
  } else if(thru===0){ label='Not Started'; state='upcoming'; }
  else if(finished){
    state='completed';
    if(diff===0){ label='Halved'; pointsA=0.5; pointsB=0.5; }
    else if(closed){
      var margin = Math.abs(diff);
      label = (diff>0?'Youngins':'Vets') + ' win ' + margin + '&' + remaining;
      if(diff>0) pointsA=1; else pointsB=1;
    } else {
      label = (diff>0?'Youngins':'Vets') + ' win ' + Math.abs(diff) + ' UP';
      if(diff>0) pointsA=1; else pointsB=1;
    }
  } else {
    state='live';
    label = diff===0 ? ('AS thru '+thru) : ((diff>0?'Youngins':'Vets')+' '+Math.abs(diff)+' UP thru '+thru);
  }
  return { thru:thru, diff:diff, finished:finished, closedEarly:closed && thru<18, state:state, label:label, pointsA:pointsA, pointsB:pointsB };
}

// The cumulative "who's up" line for the scorecard strip — one entry per
// hole showing the running match status right after that hole was decided
// (e.g. "1 UP", "AS"), same clinch-early rule as computeMatch. null for any
// hole not yet reached or played after the match has already closed out.
function matchRunningStatus(match){
  var diff=0, closed=false;
  var out = [];
  for(var i=0;i<18;i++){
    if(closed){ out.push(null); continue; }
    var outcome = holeOutcome(match, i);
    if(!outcome){ out.push(null); continue; }
    var thru = i+1;
    if(outcome.winner==='A') diff++;
    else if(outcome.winner==='B') diff--;
    var remaining = 18 - thru;
    var side = diff===0 ? 'AS' : (diff>0 ? 'A' : 'B');
    var label = diff===0 ? 'AS' : (Math.abs(diff)+' UP');
    out.push({ label: label, side: side });
    if(Math.abs(diff) > remaining) closed = true;
  }
  return out;
}

/* ---------- Supabase data layer ----------
   Swapped in place of the old Google Apps Script google.script.run

               teams:{a,b}, handicaps, adminPin}

function genPlaceholderCourse_(name){
  var pars=[4,3,5,4,4,3,4,5,4,4,4,3,5,4,4,3,5,4];
  var tees=['Back','Middle','Forward'];
  var holes=[];
  for(var i=0;i<18;i++){
    var par=pars[i];
    var base = par===3?165:par===5?520:395;
    var variance=(i%4)*7-10;
    holes.push({ number:i+1, par:par, strokeIndex:i+1,
      yardages:{ Back:base+30+variance, Middle:base+variance, Forward:base-70+variance } });
  }
  return { name:name, tees:tees, displayTee:'Middle', holes:holes };
}

/* ---------- state: Supabase is the source of truth. We fetch all three
   tables on load / poll (safety net, same 8s cadence as before), and a
   realtime subscription on `matches` (wired below, near boot) triggers an
   extra loadState() the moment any user's save lands, so every open tab
   re-renders without waiting for the poll. ---------- */
function loadState(){
  Promise.all([
    sb.from('config').select('*'),
    sb.from('courses').select('*'),
    sb.from('matches').select('*')
  ]).then(function(results){
    var configRes = results[0], coursesRes = results[1], matchesRes = results[2];
    if(configRes.error) throw configRes.error;
    if(coursesRes.error) throw coursesRes.error;
    if(matchesRes.error) throw matchesRes.error;

    var configRow = (configRes.data && configRes.data[0]) || null;
    var config = configRow ? configRow.data : defaultConfig_();
    if(!config.adminPin) config.adminPin = '2026';

    var courses = {};
    (coursesRes.data || []).forEach(function(row){ courses[row.id] = row.data; });
    if(Object.keys(courses).length === 0) courses = defaultCourses_();

    var matches = {};
    (matchesRes.data || []).forEach(function(row){
      var m = row.data;
      m.id = row.id; // keep in sync with the row id, same guarantee getState() gave
      matches[row.id] = m;
    });
    if(Object.keys(matches).length === 0) matches = defaultMatches_();

    onState({ config: config, courses: courses, matches: matches, serverTime: new Date().toISOString() });
  }).catch(function(err){
    toast('Could not refresh — will retry');
  });
}
function onState(state){
  live.config = state.config;
  live.courses = state.courses;
  live.matches = state.matches;
  loaded = true;
  // The background refresh above runs every few seconds so scores update
  // live for everyone watching — but while you're on the Admin screen
  // picking pairings (or editing courses/roster), it was rebuilding those
  // dropdowns from scratch before you got to hit "Save," snapping your
  // in-progress pick back to "— Select —". Admin already re-renders itself
  // right after every successful save, so it's safe to just skip this
  // background re-render while sitting on that screen.
  if(Router.route && Router.route.name === 'admin') return;
  render();
}

function toast(msg){
  var holder = document.getElementById('toast-holder');
  var el = document.createElement('div');
  el.className='save-toast'; el.textContent=msg;
  holder.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; }, 1400);
  setTimeout(function(){ if(el.parentNode) holder.removeChild(el); }, 1800);
}

/* Atomic single-score write: calls the update_hole_score() Postgres function,
   which does the whole read-merge-write as one jsonb_set() inside a single
   UPDATE statement server-side. This is what makes concurrent scoring safe —
   there is no client-side fetch-mutate-writeback gap for two people to race
   inside, unlike the old whole-holes-blob approach. `score` may be null to
   clear an entry (stored as a jsonb null, which the scoring math already
   treats as "no score" since it only counts typeof===number values). */
function writeHoleScore(matchId, holeNum, player, score){
  sb.rpc('update_hole_score', { match_id: matchId, hole_num: holeNum, player: player, score: score })
    .then(function(res){
      if(res && res.error) throw res.error;
      toast('Saved');
    }).catch(function(err){
      toast('Could not save — try again');
    });
}
function resetMatch(matchId){
  var holes = emptyHoles();
  live.matches[matchId].holes = holes;
  render();
  sb.from('matches').select('data').eq('id', matchId).single().then(function(res){
    if(res.error || !res.data) throw (res.error || new Error('Match not found.'));
    var data = res.data.data;
    data.holes = holes;
    return sb.from('matches').update({ data: data }).eq('id', matchId);
  }).then(function(res){
    if(res && res.error) throw res.error;
    toast('Match reset');
  }).catch(function(err){
    toast('Could not reset — try again');
  });
}

/* ---------- admin ----------
   PIN check happens client-side against live.config.adminPin (cached from
   the last loadState()) / a fresh fetch on login. This is a SOFT gate
   against accidental edits by non-admins, same trust model as the old
   Apps Script version once you have the anon key — there is no backend
   server here to enforce it for real, and RLS deliberately allows open
   writes to config/courses so this UI-level check can work at all. */
function checkPin_(pin){
  return !!pin && !!live.config && pin === live.config.adminPin;
}
function adminLogin(pin, onOk, onFail){
  sb.from('config').select('data').eq('id','main').single().then(function(res){
    if(res.error || !res.data) throw (res.error || new Error('Config not found.'));
    var cfgPin = res.data.data.adminPin || '2026';
    onOk(pin === cfgPin);
  }).catch(function(err){ onFail(err); });
}
function changeAdminPin(oldPin, newPin, onOk, onFail){
  sb.from('config').select('data').eq('id','main').single().then(function(res){
    if(res.error || !res.data) throw (res.error || new Error('Config not found.'));
    var data = res.data.data;
    var cfgPin = data.adminPin || '2026';
    if(oldPin !== cfgPin) throw { message: 'Wrong admin PIN.' };
    if(!newPin || String(newPin).length < 4) throw { message: 'Pick a PIN of at least 4 characters.' };
    data.adminPin = String(newPin);
    return sb.from('config').update({ data: data }).eq('id','main');
  }).then(function(res){
    if(res && res.error) throw res.error;
    onOk();
  }).catch(function(err){ onFail(err); });
}

function adminCall(fnName, args, onOk){
  function fail(){
    toast('Admin PIN rejected — please re-enter it');
    isAdmin = false; adminPin = null;
    try{ sessionStorage.removeItem('bc_admin_pin'); }catch(e){}
    render();
  }
  if(fnName === 'savePairing'){
    var pin = args[0], matchId = args[1], patch = args[2];
    if(!checkPin_(pin)) return fail();
    sb.from('matches').select('data').eq('id', matchId).single().then(function(res){
      if(res.error || !res.data) throw (res.error || new Error('Match not found.'));
      var data = Object.assign({}, res.data.data, patch);
      return sb.from('matches').update({ data: data }).eq('id', matchId);
    }).then(function(res){
      if(res && res.error) throw res.error;
      onOk && onOk(true);
    }).catch(fail);
  } else if(fnName === 'saveCourse'){
    var pin2 = args[0], courseId = args[1], courseData = args[2];
    if(!checkPin_(pin2)) return fail();
    sb.from('courses').upsert({ id: courseId, data: courseData }).then(function(res){
      if(res && res.error) throw res.error;
      onOk && onOk(true);
    }).catch(fail);
  } else if(fnName === 'saveConfig'){
    var pin3 = args[0], configData = args[1];
    if(!checkPin_(pin3)) return fail();
    sb.from('config').update({ data: configData }).eq('id','main').then(function(res){
      if(res && res.error) throw res.error;
      onOk && onOk(true);
    }).catch(fail);
  }
}

/* A roster edit that renames or removes a player has to ripple into every
   match that already has them paired up — otherwise a rename orphans their
   in-progress scores under the old name, and a removal leaves a ghost in a
   pairing. Re-fetches each affected match fresh (rather than trusting the
   local cache) so this can't clobber a score someone else just posted. */
function applyRosterRenamesToMatches(pin, renameMap, removedNames, onDone){
  if(!checkPin_(pin)) return onDone && onDone();
  var ids = Object.keys(live.matches).filter(function(id){
    var names = (live.matches[id].teamA||[]).concat(live.matches[id].teamB||[]);
    return names.some(function(n){ return renameMap[n] || removedNames.indexOf(n)!==-1; });
  });
  if(!ids.length) return onDone && onDone();
  Promise.all(ids.map(function(id){
    return sb.from('matches').select('data').eq('id', id).single().then(function(res){
      if(res.error || !res.data) throw (res.error || new Error('Match not found.'));
      var data = res.data.data;
      function fix(arr){
        return (arr||[]).map(function(n){ return renameMap[n]||n; }).filter(function(n){ return removedNames.indexOf(n)===-1; });
      }
      data.teamA = fix(data.teamA);
      data.teamB = fix(data.teamB);
      Object.keys(data.holes||{}).forEach(function(hk){
        var scores = data.holes[hk].scores || {};
        Object.keys(renameMap).forEach(function(old){
          if(Object.prototype.hasOwnProperty.call(scores, old)){
            scores[renameMap[old]] = scores[old];
            delete scores[old];
          }
        });
        removedNames.forEach(function(old){ delete scores[old]; });
      });
      return sb.from('matches').update({ data: data }).eq('id', id);
    });
  })).then(function(){ onDone && onDone(); })
    .catch(function(){ toast('Roster saved, but a pairing update failed — check Pairings tab.'); onDone && onDone(); });
}

function courseName(id){ return (live.courses[id] && live.courses[id].name) || id; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function matchList(){
  return Object.keys(live.matches).sort(function(x,y){
    var mx=live.matches[x], my=live.matches[y];
    if(mx.round!==my.round) return mx.round-my.round;
    return x.localeCompare(y);
  }).map(function(k){ return live.matches[k]; });
}
function overallTotals(){
  var pa=0, pb=0, decided=0;
  matchList().forEach(function(m){
    var c = computeMatch(m);
    if(c.finished){ pa+=c.pointsA; pb+=c.pointsB; decided++; }
  });
  return { pa:pa, pb:pb, decided:decided, remaining:12-decided };
}
function roundTotals(round){
  var pa=0,pb=0;
  matchList().filter(function(m){return m.round===round;}).forEach(function(m){
    var c=computeMatch(m); pa+=c.pointsA; pb+=c.pointsB;
  });
  return {pa:pa,pb:pb};
}
function teamNames(m){
  var an = (m.teamA||[]).length? m.teamA.join(' / ') : 'TBD';
  var bn = (m.teamB||[]).length? m.teamB.join(' / ') : 'TBD';
  return {a:an, b:bn};
}

/* ---------- player records & round scores (Teams page) ---------- */
function playerSide(match, name){
  if((match.teamA||[]).indexOf(name)!==-1) return 'A';
  if((match.teamB||[]).indexOf(name)!==-1) return 'B';
  return null;
}
function playerMatches(name){
  return matchList().filter(function(m){ return playerSide(m,name)!==null; });
}
// Live win-loss-halve record, updated automatically as matches finish.
function playerRecord(name){
  var w=0,l=0,h=0,liveCount=0;
  playerMatches(name).forEach(function(m){
    var c = computeMatch(m);
    if(!c.finished){ if(c.state==='live') liveCount++; return; }
    var side = playerSide(m,name);
    var pts = side==='A'? c.pointsA : c.pointsB;
    if(pts===1) w++; else if(pts===0.5) h++; else l++;
  });
  return { w:w, l:l, h:h, live:liveCount };
}
function recordText(rec){
  return rec.w+'-'+rec.l+(rec.h? '-'+rec.h : '');
}
function playerBadge(rec){
  if(rec.w>=2) return '<span class="pbadge" title="Heating up">\u{1F525}</span>';
  if(rec.l>=2) return '<span class="pbadge" title="Ice cold">\u{1F976}</span>';
  return '';
}
// A player's gross AND net score for one round (one match), net computed by
// subtracting whatever handicap strokes that match's allocation gives them
// on each hole they've actually posted a score for — same per-match low-
// handicap allocation used everywhere else, so it always matches the
// scorecard's own hole-by-hole net numbers.
function playerRoundScore(match, name){
  var total=0, net=0, thru=0;
  var cfg = live.config;
  var lowHcp = matchLowHandicap(match, cfg);
  var course = live.courses[match.courseId];
  for(var i=1;i<=18;i++){
    var hh = match.holes && match.holes[String(i)];
    var v = hh && hh.scores && hh.scores[name];
    if(typeof v==='number' && v>0){
      total += v; thru++;
      var si = course && course.holes && course.holes[i-1] && course.holes[i-1].strokeIndex;
      var strokes = (lowHcp!==null && si) ? strokesOnHole(playerStrokes(name, cfg, lowHcp, match), si) : 0;
      net += (v - strokes);
    }
  }
  return { total:total, net:net, thru:thru };
}
function formatRoundScore(rs){
  if(!rs || rs.thru===0) return '—';
  var g = rs.total + (rs.thru<18 ? (' thru '+rs.thru) : '');
  if(rs.net!==rs.total) return g + ' / ' + rs.net;
  return g;
}
function playerRoundLines(name){
  var byRound = {};
  playerMatches(name).forEach(function(m){ byRound[m.round] = playerRoundScore(m, name); });
  return [1,2,3].map(function(r){
    return 'R'+r+': '+formatRoundScore(byRound[r]);
  }).join('&nbsp;&nbsp;·&nbsp;&nbsp;');

    this.parse();
  },
  parse:function(){
    var h = location.hash.replace('#','') || 'board';
    var parts = h.split('/');
    this.route = { name: parts[0], id: parts[1] };
    this.render();
  },
  go:function(h){ location.hash = h; },
  render:function(){
    var app = document.getElementById('app');
    if(!loaded){
      app.innerHTML = Header() + '<div class="card empty-note">Loading the clubhouse…</div>';
      app.insertAdjacentHTML('beforeend', TabBar(this.route.name));
      return;
    }
    var body = '';
    switch(this.route.name){
      case 'board': body = ViewBoard(); break;
      case 'teams': body = ViewTeams(); break;
      case 'matches': body = ViewMatches(); break;
      case 'match': body = ViewMatchDetail(this.route.id); break;
      case 'admin': body = ViewAdmin(); break;
      default: body = ViewBoard();
    }
    app.innerHTML = Header() + body;
    app.insertAdjacentHTML('beforeend', TabBar(this.route.name));
    // The backlink (match detail's "All Matches" bar) sticks right under
    // the topbar — but the topbar's own height isn't fixed (its subtitle
    // wraps to a second line on narrow screens), so its stick point is
    // measured from the real rendered topbar rather than assumed.
    var backEl = document.querySelector('.backlink');
    if(backEl){
      var topbarEl = document.querySelector('.topbar');
      var topbarH = topbarEl ? topbarEl.getBoundingClientRect().height : 0;
      backEl.style.top = 'calc(env(safe-area-inset-top, 0px) + ' + topbarH + 'px)';
    }
    wireEvents(this.route);
  }
};

function Header(){
  return '<div class="topbar">'+crestSvg()+
    '<div class="brand"><div class="name">'+esc(live.config.edition||'')+' '+esc(live.config.eventName||'Bantam Cup')+'</div>'+
    '<div class="sub">Trinity Bantams · Golf Weekend</div></div>'+
    '<div class="badge-est">Est. '+esc(live.config.estYear||'')+'</div>'+
    '</div>';
}

function TabBar(active){
  var tabs = [
    ['board','Score','\u{1F3D2}'],
    ['matches','Matches','⛳'],
    ['teams','Teams','\u{1F465}'],
    ['admin','Admin','⚙️']
  ];
  var html = '<nav class="tabs"><div class="row">';
  tabs.forEach(function(t){
    html += '<button data-nav="'+t[0]+'" class="'+(active===t[0]?'active':'')+'"><span class="ic">'+t[2]+'</span>'+t[1]+'</button>';
  });
  html += '</div></nav>';
  return html;
}

function ViewBoard(){
  var tot = overallTotals();
  var pctA = tot.decided ? (tot.pa/12*100) : 0;
  var pctB = tot.decided ? (tot.pb/12*100) : 0;
  var winner = tot.pa>=6.5 ? 'a' : tot.pb>=6.5 ? 'b' : (tot.pa===6 && tot.pb===6 ? 'tie' : null);
  var clockText = tot.decided===0 ? 'Puck drop pending' : (tot.decided===12 ? 'Final horn' : (tot.decided+' of 12 matches decided'));

  var goalLight = '';
  if(winner==='a') goalLight = '<div class="goal-light">\u{1F6A8} THE YOUNGINS WIN THE CUP \u{1F6A8}</div>';
  else if(winner==='b') goalLight = '<div class="goal-light">\u{1F6A8} THE VETS WIN THE CUP \u{1F6A8}</div>';
  else if(winner==='tie') goalLight = '<div class="goal-light">CUP RETAINED · 6–6 TIE</div>';

  var rounds = [
    {n:1,label:'Round 1',sub:'Best Ball',courseId:'tobacco-road'},
    {n:2,label:'Round 2',sub:'Best Ball',courseId:'talamore'},
    {n:3,label:'Round 3',sub:'Singles',courseId:'mid-south'}
  ];
  // Live scores live here now (there's no separate Live tab): each round's
  // own header sits directly above that round's matches, so the moment you
  // land on Score you see every match's state — live, final, or "Not
  // Started" (never a bare "vs", which used to leave it ambiguous whether a
  // match just hadn't been paired yet or simply hadn't teed off).
  var roundsHtml = rounds.map(function(r){
    var rt = roundTotals(r.n);
    var matchesHtml = matchList().filter(function(m){return m.round===r.n;})
      .map(function(m){ return MatchRowHtml(m, { tag: m.id.toUpperCase() }); }).join('');
    return '<div class="round-block">'+
      '<div class="round-header">'+
        '<div class="rtitle">'+r.label+' · '+r.sub+' · <b>'+esc(courseName(r.courseId))+'</b></div>'+
        '<div class="rscore-mini"><span class="a tnum">'+rt.pa+'</span><span class="sep">–</span><span class="b tnum">'+rt.pb+'</span></div>'+
      '</div>'+
      '<div class="stack">'+matchesHtml+'</div>'+
    '</div>';
  }).join('<hr class="div">');

  return '<div class="stack">'+
    '<div class="board">'+
      '<div class="event-line">Faceoff — First to 6.5 wins outright</div>'+
      '<div class="scoreline">'+
        '<div class="teambox a"><div class="tname">Youngins</div><div class="tscore tnum">'+tot.pa+'</div></div>'+
        '<div class="vs-mid"></div>'+
        '<div class="teambox b"><div class="tname">Vets</div><div class="tscore tnum">'+tot.pb+'</div></div>'+
      '</div>'+
      '<div class="thermo"><div class="segA" style="width:'+pctA+'%"></div><div class="segB" style="width:'+pctB+'%"></div><div class="mid-tick"></div></div>'+
      '<div class="clock">'+clockText+' <b>· '+tot.remaining+' pts on the board</b></div>'+
      goalLight+
    '</div>'+
    '<div class="section-label">By Round</div>'+
    roundsHtml+
  '</div>';
}

function ViewTeams(){
  var cfg = live.config;
  function rosterHtml(teamKey){
    var team = cfg.teams[teamKey];
    var cards = (team.players||[]).map(function(p,i){
      var rec = playerRecord(p);
      var recClass = rec.w>=2 ? 'hot' : (rec.l>=2 ? 'cold' : '');
      var liveTag = rec.live ? ' <span class="live-tag">· '+rec.live+' live</span>' : '';
      return '<div class="jersey '+teamKey+'"><div class="num">'+(i+1)+'</div>'+
        '<div class="pinfo">'+
          '<div class="pname">'+esc(p)+' '+playerBadge(rec)+'</div>'+
          '<div class="precord '+recClass+'">'+recordText(rec)+liveTag+'</div>'+
          '<div class="pscores">'+playerRoundLines(p)+'</div>'+
        '</div></div>';
    }).join('');
    return '<div class="card"><div class="teamhead"><div class="swatch '+teamKey+'"></div><h3 style="font-size:16px;color:'+(teamKey==='a'?'var(--a-text)':'var(--gold-text)')+'">'+esc(team.name)+'</h3></div>'+
      '<div class="roster">'+cards+'</div></div>';
  }
  return '<div class="stack">'+
    '<div class="section-label">Line Cards</div>'+
    rosterHtml('a')+rosterHtml('b')+
  '</div>';
}

// Shared by the Score page's by-round lists and the Matches tab. `opts.tag`
// overrides the small label in the top-left corner of the card — the
// Matches tab shows the course name there, but on the Score page that would
// just repeat the round header immediately above it, so it shows the match
// id (R1M1, R1M2, ...) instead. The center status always uses c.label,
// which already reads "Not Started" / "Pairings TBD" instead of a bare
// "vs" once a match hasn't teed off yet.
// A thin top accent stripe in whichever team's color is currently ahead —
// blue for Youngins, gold for Vets, neutral once a match is level or hasn't
// started — so scanning a whole round's worth of cards shows who's winning
// without having to read every status label.
function matchLeadClass(c){
  if(c.state==='live') return c.diff>0?'lead-a':c.diff<0?'lead-b':'';
  if(c.state==='completed') return c.pointsA>c.pointsB?'lead-a':c.pointsB>c.pointsA?'lead-b':'';
  return '';
}
function MatchRowHtml(m, opts){
  var c = computeMatch(m);
  var tn = teamNames(m);
  var pillClass = c.state;
  var pillText = c.state==='live'?'<span class="dot"></span>Live':c.state==='completed'?'Final':'Upcoming';
  var tag = (opts && opts.tag) || esc(courseName(m.courseId));
  var rowClass = 'card matchrow '+matchLeadClass(c)+(c.state==='live'?' is-live':'');
  return '<div class="'+rowClass+'" data-nav="match/'+m.id+'">'+
    '<div class="mtop"><span class="mcourse">'+tag+'</span>'+
    '<span class="pill '+pillClass+'">'+pillText+'</span></div>'+
    '<div class="matchup"><div class="side a"><span class="lbl">Y</span> '+esc(tn.a)+'</div>'+
    '<div class="status tnum">'+c.label+'</div>'+
    '<div class="side b">'+esc(tn.b)+' <span class="lbl">V</span></div></div>'+
    '</div>';
}

function ViewMatches(){
  var rounds = [1,2,3];
  var titles = {1:'Round 1 · Best Ball',2:'Round 2 · Best Ball',3:'Round 3 · Singles'};
  var html = '';
  rounds.forEach(function(r){
    html += '<div class="section-label">'+titles[r]+'</div><div class="stack">';
    matchList().filter(function(m){return m.round===r;}).forEach(function(m){
      html += MatchRowHtml(m);
    });
    html += '</div>';
  });
  return html;
}
function ScorecardStrip(course, match){
  var holes = (course && course.holes) || [];
  if(!holes.length) return '';
  var tee = (course && course.displayTee) || (course.tees && course.tees[0]);
  var parRow = '<tr><th>Par</th>' + holes.map(function(h){ return '<td>'+h.par+'</td>'; }).join('') + '<td><b>'+holes.reduce(function(s,h){return s+h.par;},0)+'</b></td></tr>';
  var ydsRow = '<tr><th>Yds ('+esc(tee)+')</th>' + holes.map(function(h){ return '<td>'+((h.yardages&&h.yardages[tee])||'—')+'</td>'; }).join('') + '<td><b>'+holes.reduce(function(s,h){return s+((h.yardages&&h.yardages[tee])||0);},0)+'</b></td></tr>';
  var hcpRow = '<tr><th>HCP</th>' + holes.map(function(h){ return '<td>'+(h.strokeIndex||'—')+'</td>'; }).join('') + '<td></td></tr>';
  var headRow = '<tr><th>Hole</th>' + holes.map(function(h){ return '<td>'+h.number+'</td>'; }).join('') + '<td>Tot</td></tr>';
  var teamRows = '';
  // Best-ball (2v2) matches get a running "team's low ball" line — the
  // lower of each team's two NET scores on that hole (handicap strokes
  // already subtracted), the number that actually decides the hole. You
  // enter your real, actual gross score; this row does the handicap math
  // for you so you never have to hand-adjust what you type in.
  if(match && match.type==='bestball'){
    function teamRow(side, label, colorClass){
      var total = 0, anyVal = false;
      var cells = holes.map(function(h, i){
        var tb = teamHoleBest(match, side, i);
        if(!tb) return '<td class="tb-cell tb-empty">—</td>';
        total += tb.best; anyVal = true;
        var oc = holeOutcome(match, i);
        var won = oc && oc.winner===side;
        return '<td class="tb-cell tb-filled'+(won?' tb-win':'')+'">'+tb.best+'</td>';
      }).join('');
      return '<tr class="team-best-row '+colorClass+'"><th>'+esc(label)+'</th>'+cells+'<td><b>'+(anyVal?total:'—')+'</b></td></tr>';
    }
    teamRows = teamRow('A','Youngins Best','a') + teamRow('B','Vets Best','b');
  }
  // Running "who's up" line — cumulative match status through each hole,
  // colored by whichever side is ahead at that point (Youngins in blue,
  // Vets in gold).
  var statusRow = '';
  if(match && match.teamA && match.teamA.length && match.teamB && match.teamB.length){
    var running = matchRunningStatus(match);
    var statusCells = holes.map(function(h, i){
      var r = running[i];
      if(!r) return '<td class="ms-cell ms-empty">—</td>';
      var cls = r.side==='A' ? 'ms-a' : r.side==='B' ? 'ms-b' : 'ms-as';
      return '<td class="ms-cell '+cls+'">'+esc(r.label)+'</td>';
    }).join('');
    var finalC = computeMatch(match);
    statusRow = '<tr class="match-status-row"><th>Who’s Up</th>'+statusCells+'<td><b>'+esc(finalC.label||'')+'</b></td></tr>';
  }
  return '<div class="scorecard-wrap"><table class="scorecard"><thead>'+headRow+'</thead><tbody>'+parRow+ydsRow+hcpRow+teamRows+statusRow+'</tbody></table></div>';
}

function ViewMatchDetail(id){
  var m = live.matches[id];
  if(!m) return '<div class="card">Match not found. <button data-nav="matches" class="btn secondary" style="margin-top:10px;">Back to Matches</button></div>';
  var c = computeMatch(m);
  var tn = teamNames(m);
  var course = live.courses[m.courseId] || {holes:[]};
  var noPairings = !(m.teamA&&m.teamA.length) || !(m.teamB&&m.teamB.length);

  var entriesHtml = '';
  var lowHcp = matchLowHandicap(m, live.config);
  var handicapsReady = lowHcp!==null;
  if(noPairings){
    entriesHtml = '<div class="card no-pairings-note">Pairings for this match haven’t been set yet. Add players in Admin → Pairings to start entering scores.</div>';
  } else {
    function strokesFor(p, holeIdx){
      if(!handicapsReady) return 0;
      var si = course.holes && course.holes[holeIdx] && course.holes[holeIdx].strokeIndex;
      return strokesOnHole(playerStrokes(p, live.config, lowHcp, m), si);
    }
    // Blatant on purpose: a filled gold pill with the word STROKE(S) right on
    // the player's row, not a subtle dot — this is the one thing a player
    // glances at mid-round to know if they get a shot back on this hole.
    function strokeChip(p, holeIdx){
      var n = strokesFor(p, holeIdx);
      if(!n) return '';
      var dots = n<=3 ? new Array(n+1).join('●') : ('●×'+n);
      return '<span class="stroke-chip" title="Gets '+n+' stroke'+(n>1?'s':'')+' on this hole">\u{1F36C} '+dots+' '+(n>1?'STROKES':'STROKE')+'</span>';
    }
    function playerRow(p, side, i, hk){
      var val = (m.holes[hk] && m.holes[hk].scores && m.holes[hk].scores[p]);
      var net = (typeof val==='number') ? (val - strokesFor(p,i)) : null;
      var stroking = strokesFor(p,i) > 0;
      return '<div class="he-player side-'+side+(stroking?' has-stroke':'')+'">'+
        '<span class="he-pname-wrap"><span class="he-pname">'+esc(p)+'</span>'+strokeChip(p,i)+'</span>'+
        Stepper(m.id,i,p,val,net)+'</div>';
    }
    for(var i=0;i<18;i++){
      var hole = (course.holes && course.holes[i]) || {par:4};
      var yards = holeYardage(course, i);
      var outcome = holeOutcome(m, i);
      var decidedAlready = c.closedEarly && (i+1) > c.thru;
      var badge = '';
      if(outcome){
        if(outcome.winner==='AS') badge = '<span class="he-outcome push">Push</span>';
        else if(outcome.winner==='A') badge = '<span class="he-outcome a">Youngins win hole</span>';
        else badge = '<span class="he-outcome b">Vets win hole</span>';
      }
      if(decidedAlready){
        badge += '<span class="he-outcome for-record">For the record</span>';
      }
      var hk = String(i+1);
      var holeHasStrokes = m.teamA.concat(m.teamB).some(function(p){ return strokesFor(p,i) > 0; });
      var players = m.teamA.map(function(p){ return playerRow(p,'a',i,hk); })
        .concat(m.teamB.map(function(p){ return playerRow(p,'b',i,hk); })).join('');
      var bestLine = outcome ? '<div class="he-best">'+(outcome.usingHandicap?'Net best':'Best')+': Youngins '+outcome.aBest+' · Vets '+outcome.bBest+'</div>' : '';
      entriesHtml += '<div class="card hole-entry'+(decidedAlready?' past-decision':'')+(holeHasStrokes?' has-strokes':'')+'" data-hole-card="'+i+'">'+
        '<div class="he-top"><span class="he-hole">Hole '+(i+1)+'</span>'+
        '<span class="he-meta">Par '+hole.par+(yards?' · '+yards+' yds':'')+(hole.strokeIndex?' · SI '+hole.strokeIndex:'')+'</span>'+badge+'</div>'+
        '<div class="he-players">'+players+'</div>'+
        bestLine+
      '</div>';
    }
  }

  // The single highest-value line on this whole page: who gets strokes and
  // how many, spelled out in plain language before anyone scrolls into the
  // hole-by-hole list. Every gold-bordered hole card below is one of the
  // holes that makes this line true.
  var strokeSummary = '';
  if(!noPairings){
    if(handicapsReady){
      var strokeParts = m.teamA.concat(m.teamB).map(function(p){
        var n = playerStrokes(p, live.config, lowHcp, m);
        return n>0 ? '<b>'+esc(p)+'</b> +'+n : null;
      }).filter(Boolean);
      strokeSummary = '<div class="stroke-summary">'+(strokeParts.length ? '⛳ Strokes today — '+strokeParts.join('&nbsp;&nbsp;·&nbsp;&nbsp;') : 'Handicaps are even here — playing scratch, no strokes given.')+'</div>';
    } else {
      strokeSummary = '<div class="hcp-note">Playing scratch (gross scores) — add everyone’s handicap in Admin → Roster to score this match net.</div>';
    }
  }

  var lockedBanner = c.finished ? '<div class="locked-banner">✓ Match final · '+ (c.pointsA?'1':'0.5') +' pt awarded'+(c.closedEarly?' — remaining holes optional, won\'t change the result':'')+'</div>' : '';
  return '<div class="stack">'+
    '<button class="backlink" data-nav="matches">← All Matches</button>'+
    '<div class="card detail-head">'+
      '<div class="vsline"><b class="a">'+esc(tn.a)+'</b><br><span style="color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;">VS</span><br><b class="b">'+esc(tn.b)+'</b></div>'+
      '<div class="course">'+esc(courseName(m.courseId))+' · '+ (m.type==='singles'?'Singles':'Best Ball') +'</div>'+
      '<div class="status-big">'+ (c.thru? c.label : 'On the Tee') +'</div>'+
      lockedBanner+
      strokeSummary+
      ScorecardStrip(course, m)+
    '</div>'+
    '<div class="section-label">Enter Scores — Hole by Hole'+(c.finished?' (result final)':'')+'</div>'+
    '<div class="stack" data-match="'+m.id+'">'+entriesHtml+'</div>'+
    (c.finished? '<button class="btn secondary" data-reset-match="'+m.id+'">Reset match</button>' : '')+
  '</div>';
}

function Stepper(matchId, holeIdx, player, value, netVal){
  var v = (typeof value==='number') ? value : '';
  // When handicap strokes apply and a gross score is entered, show the net
  // score right next to it (e.g. "4" gross with a "/3" net tag) so you can
  // see the stroke-adjusted number without having to type it in yourself.
  var netTag = (typeof value==='number' && typeof netVal==='number' && netVal!==value)
    ? '<span class="net-tag">/'+netVal+'</span>' : '';
  return '<div class="he-stepper" data-match-id="'+matchId+'" data-hole-idx="'+holeIdx+'" data-player="'+esc(player)+'">'+
    '<button data-step="-1" type="button">−</button>'+
    '<input type="number" inputmode="numeric" min="1" max="15" value="'+v+'" placeholder="–" data-score-input>'+
    '<button data-step="1" type="button">+</button>'+
    netTag+
  '</div>';
}

var adminTab = 'pairings';
function ViewAdmin(){
  if(!isAdmin){
    return '<div class="pin-gate"><h3 style="margin-bottom:14px;">Admin Access</h3>'+
      '<div class="field-row"><input type="password" id="admin-pin-input" inputmode="numeric" placeholder="Enter PIN"></div>'+
      '<button class="btn" id="admin-pin-submit" style="width:100%;margin-top:6px;">Unlock</button>'+
      '<div class="pin-error">'+esc(adminError)+'</div></div>';
  }

  }).join('')+'<button data-admin-logout style="margin-left:auto;">Log out</button></div>';

function AdminPairings(){
  var cfg = live.config;
  var html = '';
  [1,2,3].forEach(function(r){
    html += '<div class="section-label">Round '+r+' '+(r===3?'(Singles)':'(Best Ball)')+'</div><div class="stack">';
    matchList().filter(function(m){return m.round===r;}).forEach(function(m){
      var count = m.type==='singles'?1:2;
      html += '<div class="card admin-block" data-match-admin="'+m.id+'">';
      html += '<h3>'+m.id.toUpperCase()+'</h3>';
      html += '<div class="field-row"><label>Course</label><select data-field="courseId">'+
        Object.keys(live.courses).map(function(cid){ return '<option value="'+cid+'" '+(m.courseId===cid?'selected':'')+'>'+esc(courseName(cid))+'</option>'; }).join('')+
        '</select></div>';
      html += '<div class="grid2">';
      for(var side=0; side<2; side++){
        var teamKey = side===0?'a':'b';
        var players = cfg.teams[teamKey].players;
        var current = m['team'+(teamKey==='a'?'A':'B')] || [];
        html += '<div><label style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;">'+ (teamKey==='a'?'Youngins':'Vets') +'</label>';
        for(var slot=0; slot<count; slot++){
          html += '<select data-field="player" data-side="'+teamKey+'" data-slot="'+slot+'" style="margin-top:6px;">'+
            '<option value="">— Select —</option>'+
            players.map(function(p){ return '<option value="'+esc(p)+'" '+(current[slot]===p?'selected':'')+'>'+esc(p)+'</option>'; }).join('')+
            '</select>';
        }
        html += '</div>';
      }
      html += '</div>';
      html += '<div class="row" style="gap:8px;margin-top:12px;"><button class="btn" data-save-pairing="'+m.id+'">Save</button>'+
        '<button class="btn danger" data-reset-match="'+m.id+'">Reset Scores</button></div>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

function AdminCourses(){
  var html = '';
  Object.keys(live.courses).forEach(function(cid){
    var course = live.courses[cid];
    var tees = course.tees || [];
    var gridCols = '22px 1fr 1fr ' + tees.map(function(){return '1fr';}).join(' ');
    html += '<div class="card admin-block" data-course-admin="'+cid+'">';
    html += '<h3>'+esc(course.name)+'</h3>';
    html += '<div class="field-row"><label>Tee names (front-to-back, longest first)</label>';
    html += '<div style="display:grid;grid-template-columns:repeat('+tees.length+',1fr);gap:8px;">'+
      tees.map(function(t,ti){ return '<input type="text" data-tee-name-idx="'+ti+'" value="'+esc(t)+'">'; }).join('')+
    '</div></div>';
    var curDisplayIdx = Math.max(0, tees.indexOf(course.displayTee));
    html += '<div class="field-row"><label>Scorecard yardage shown to players</label><select data-tee-select>'+
      tees.map(function(t,ti){ return '<option value="'+ti+'" '+(ti===curDisplayIdx?'selected':'')+'>'+esc(t)+' tees</option>'; }).join('')+
      '</select></div>';
    html += '<div class="course-holes-table"><div class="chr headr" style="grid-template-columns:'+gridCols+';"><div>#</div><div>Par</div><div>SI</div>'+
      tees.map(function(t){ return '<div>'+esc(t)+'</div>'; }).join('')+'</div>';
    for(var i=0;i<18;i++){
      var h = course.holes[i];
      html += '<div class="chr" style="grid-template-columns:'+gridCols+';">'+
        '<div class="hnum" style="font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);">'+h.number+'</div>'+
        '<input type="number" data-hf="par" data-hi="'+i+'" value="'+h.par+'">'+
        '<input type="number" data-hf="strokeIndex" data-hi="'+i+'" min="1" max="18" value="'+(h.strokeIndex||'')+'">'+
        tees.map(function(t,ti){ return '<input type="number" data-hf="yardage" data-tee-idx="'+ti+'" data-hi="'+i+'" value="'+((h.yardages&&h.yardages[t])||'')+'">'; }).join('')+
        '</div>';
    }
    html += '</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);margin-top:6px;">SI = Stroke Index (1 = hardest hole, 18 = easiest) — sets which holes get handicap strokes.</div>';
    html += '<button class="btn" style="margin-top:10px;" data-save-course="'+cid+'">Save Course</button></div>';
  });
  return html;
}

// A single player row: name + handicap side by side, plus a remove button.
// data-orig carries the name this row was loaded with, so Save can tell an
// edit (rename) apart from a brand-new blank row with no history yet.
function rosterRowHtml(teamKey, name, hcp){
  return '<div class="roster-row" data-team="'+teamKey+'" data-orig="'+esc(name)+'">'+
    '<input type="text" class="rr-name" value="'+esc(name)+'" placeholder="Player name">'+
    '<input type="number" step="0.1" class="rr-hcp" placeholder="HCP" value="'+(hcp===''?'':esc(hcp))+'">'+
    '<button type="button" class="rr-remove" aria-label="Remove player">✕</button>'+
  '</div>';
}
function AdminRoster(){
  var cfg = live.config;
  var html = '<div class="card admin-block" data-roster-admin="1">';
  html += '<div class="field-row"><label>Event Name</label><input type="text" id="f-eventname" value="'+esc(cfg.eventName)+'"></div>';
  html += '<div class="grid2">';
  html += '<div class="field-row"><label>Edition</label><input type="text" id="f-edition" value="'+esc(cfg.edition)+'"></div>';
  html += '<div class="field-row"><label>Est. Year</label><input type="number" id="f-estyear" value="'+esc(cfg.estYear)+'"></div>';
  html += '</div><hr class="div">';
  html += '<div class="hcp-help">Add, rename or remove a player any time — no code changes needed. Renaming keeps their scores and pairings; removing pulls them out of any pairing they’re in. Leave handicap blank until you have it; a match plays scratch until everyone in it has one.</div>';
  ['a','b'].forEach(function(k){
    var label = k==='a' ? 'Youngins' : 'Vets';
    html += '<div class="field-row"><label>'+label+' Team Name</label><input type="text" data-teamname="'+k+'" value="'+esc(cfg.teams[k].name)+'"></div>';
    html += '<div class="roster-editor-label">'+label+' Roster · Name &amp; Handicap</div>';
    html += '<div class="roster-rows" data-roster-rows="'+k+'">';
    (cfg.teams[k].players||[]).forEach(function(p){
      var hc = cfg.handicaps && cfg.handicaps[p];
      html += rosterRowHtml(k, p, (typeof hc==='number'?hc:''));
    });
    html += '</div>';
    html += '<button type="button" class="btn secondary rr-add-btn" data-add-row="'+k+'">+ Add Player</button>';
    html += '<hr class="div">';
  });
  html += '<button class="btn" style="margin-top:6px;" data-save-roster="1">Save Roster</button>';
  html += '<hr class="div"><div class="field-row"><label>Change Admin PIN</label></div>'+
    '<div class="grid2"><input type="password" id="pin-old" placeholder="Current PIN"><input type="password" id="pin-new" placeholder="New PIN"></div>'+
    '<button class="btn secondary" style="margin-top:8px;" id="change-pin-btn">Update PIN</button>'+
    '<div class="pin-error" id="change-pin-msg"></div>';
  html += '</div>';
  return html;
}

/* ---------- events ---------- */
function wireEvents(route){
  document.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){ Router.go(el.getAttribute('data-nav')); });
  });

  if(route.name==='match'){
    var container = document.querySelector('[data-match]');
    if(container){
      var mid = container.getAttribute('data-match');
      function applyScore(holeIdx, player, newVal){
        var m = live.matches[mid];
        // Note: entry stays open even after a match is clinched (e.g. 4&3) so
        // players can still fill in their personal scorecard for the record.
        // computeMatch() already stops counting holes at the point the match
        // was decided, so the official result/points never change based on
        // what gets entered here afterward.
        var holeNum = holeIdx+1, key = String(holeNum);
        var score = (newVal===null || isNaN(newVal) || newVal<=0) ? null : newVal;
        // Local optimistic update only touches this one hole/player cell —
        // never a full-array copy of `holes` — matching the atomic patch we
        // actually send below (writeHoleScore -> update_hole_score rpc).
        if(!m.holes[key]) m.holes[key] = { number: holeNum, scores: {} };
        if(score===null){ m.holes[key].scores[player] = null; }
        else { m.holes[key].scores[player] = score; }
        writeHoleScore(mid, holeNum, player, score);
        render();
      }
      container.querySelectorAll('.he-stepper').forEach(function(st){
        var holeIdx = parseInt(st.getAttribute('data-hole-idx'),10);
        var player = st.getAttribute('data-player');
        var input = st.querySelector('input[data-score-input]');
        st.querySelectorAll('button[data-step]').forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            var delta = parseInt(btn.getAttribute('data-step'),10);
            var cur = parseInt(input.value,10);
            if(isNaN(cur)){
              var hole = (live.courses[live.matches[mid].courseId]||{}).holes;
              cur = (hole && hole[holeIdx] && hole[holeIdx].par) || 4;
            } else { cur = cur + delta; }
            if(cur<1) cur=1; if(cur>15) cur=15;
            applyScore(holeIdx, player, cur);
          });
        });
        input.addEventListener('change', function(){
          var v = parseInt(input.value,10);
          applyScore(holeIdx, player, isNaN(v)?null:v);
        });
        input.addEventListener('click', function(e){ e.stopPropagation(); });
      });
    }
    document.querySelectorAll('[data-reset-match]').forEach(function(el){
      el.addEventListener('click', function(){
        var mid2 = el.getAttribute('data-reset-match');
        if(!confirm('Reset all scores for '+mid2.toUpperCase()+'?')) return;
        resetMatch(mid2);
      });
    });
  }

  if(route.name==='admin'){
    if(!isAdmin){
      var submit = document.getElementById('admin-pin-submit');
      var input = document.getElementById('admin-pin-input');
      function tryLogin(){
        var pin = input.value;
        adminLogin(pin, function(ok){
          if(ok){
            isAdmin = true; adminPin = pin; adminError='';
            try{ sessionStorage.setItem('bc_admin_pin', pin); }catch(e){}
            render();
          } else {
            adminError = 'Wrong PIN — try again.';
            render();
          }
        }, function(){
          adminError = 'Could not reach the server — try again.';
          render();
        });
      }
      if(submit) submit.addEventListener('click', tryLogin);
      if(input) input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
      return;
    }

    document.querySelectorAll('[data-admin-logout]').forEach(function(el){
      el.addEventListener('click', function(){
        isAdmin = false; adminPin = null;
        try{ sessionStorage.removeItem('bc_admin_pin'); }catch(e){}
        render();
      });
    });
    document.querySelectorAll('[data-admintab]').forEach(function(el){
      el.addEventListener('click', function(){ adminTab = el.getAttribute('data-admintab'); render(); });
    });
    document.querySelectorAll('[data-save-pairing]').forEach(function(el){
      el.addEventListener('click', function(){
        var mid = el.getAttribute('data-save-pairing');
        var block = document.querySelector('[data-match-admin="'+mid+'"]');
        var courseId = block.querySelector('[data-field="courseId"]').value;
        var teamA=[], teamB=[];
        block.querySelectorAll('[data-field="player"]').forEach(function(sel){
          var side = sel.getAttribute('data-side');
          var val = sel.value;
          if(!val) return;
          if(side==='a') teamA.push(val); else teamB.push(val);
        });
        var patch = { courseId:courseId, teamA:teamA, teamB:teamB };
        Object.assign(live.matches[mid], patch);
        render();
        adminCall('savePairing', [adminPin, mid, patch], function(){ toast('Pairing saved'); });
      });
    });
    document.querySelectorAll('[data-reset-match]').forEach(function(el){
      el.addEventListener('click', function(){
        var mid = el.getAttribute('data-reset-match');
        if(!confirm('Reset all scores for '+mid.toUpperCase()+'?')) return;
        resetMatch(mid);
      });
    });
    document.querySelectorAll('[data-save-course]').forEach(function(el){
      el.addEventListener('click', function(){
        var cid = el.getAttribute('data-save-course');
        var block = document.querySelector('[data-course-admin="'+cid+'"]');
        var course = JSON.parse(JSON.stringify(live.courses[cid]));
        var newTees = course.tees.slice();
        block.querySelectorAll('[data-tee-name-idx]').forEach(function(inp){
          var ti = parseInt(inp.getAttribute('data-tee-name-idx'),10);
          newTees[ti] = inp.value.trim() || newTees[ti];
        });
        course.holes.forEach(function(h){ h.yardages = {}; });
        block.querySelectorAll('input[data-hf]').forEach(function(inp){
          var i = parseInt(inp.getAttribute('data-hi'),10);
          var field = inp.getAttribute('data-hf');
          var val = parseInt(inp.value,10)||0;
          if(field==='par') course.holes[i].par = val;
          else if(field==='strokeIndex') course.holes[i].strokeIndex = val;
          else if(field==='yardage'){
            var ti = parseInt(inp.getAttribute('data-tee-idx'),10);
            course.holes[i].yardages[newTees[ti]] = val;
          }
        });
        var teeSel = block.querySelector('[data-tee-select]');
        course.tees = newTees;
        course.displayTee = teeSel ? newTees[parseInt(teeSel.value,10)] : newTees[0];
        live.courses[cid] = course;
        render();
        adminCall('saveCourse', [adminPin, cid, course], function(){ toast('Course saved'); });
      });
    });
    // Roster rows are edited straight in the DOM (add/remove never call
    // render()) so typing a rename in one row can't get wiped out by adding
    // or deleting a row elsewhere on the same screen before you hit Save.
    function wireRosterRow(rowEl){
      rowEl.querySelector('.rr-remove').addEventListener('click', function(){
        var name = (rowEl.querySelector('.rr-name').value||'').trim() || rowEl.getAttribute('data-orig');
        var inUse = name && matchList().some(function(m){ return (m.teamA||[]).concat(m.teamB||[]).indexOf(name)!==-1; });
        if(inUse && !confirm('Remove '+name+'? They’ll also be pulled from any pairing they’re currently in.')) return;
        rowEl.remove();
      });
    }
    document.querySelectorAll('.roster-row').forEach(wireRosterRow);
    document.querySelectorAll('[data-add-row]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-add-row');
        var container = document.querySelector('[data-roster-rows="'+k+'"]');
        var wrap = document.createElement('div');
        wrap.innerHTML = rosterRowHtml(k, '', '');
        var rowEl = wrap.firstChild;
        container.appendChild(rowEl);
        wireRosterRow(rowEl);
        rowEl.querySelector('.rr-name').focus();
      });
    });
    document.querySelectorAll('[data-save-roster]').forEach(function(el){
      el.addEventListener('click', function(){
        var cfg = JSON.parse(JSON.stringify(live.config));
        cfg.eventName = document.getElementById('f-eventname').value;
        cfg.edition = document.getElementById('f-edition').value;
        cfg.estYear = parseInt(document.getElementById('f-estyear').value,10)||cfg.estYear;
        document.querySelectorAll('[data-teamname]').forEach(function(inp){
          cfg.teams[inp.getAttribute('data-teamname')].name = inp.value;
        });
        cfg.handicaps = cfg.handicaps || {};

        var renameMap = {}, removedNames = [], allNames = [], dupe = null;
        ['a','b'].forEach(function(k){
          var players = [];
          document.querySelectorAll('.roster-row[data-team="'+k+'"]').forEach(function(rowEl){
            var name = (rowEl.querySelector('.rr-name').value||'').trim();
            var orig = rowEl.getAttribute('data-orig') || '';
            var hcpVal = parseFloat(rowEl.querySelector('.rr-hcp').value);
            if(!name){
              if(orig) removedNames.push(orig);
              return;
            }
            if(allNames.indexOf(name)!==-1) dupe = name; else allNames.push(name);
            if(orig && orig!==name) renameMap[orig] = name;
            players.push(name);
            if(!isNaN(hcpVal)) cfg.handicaps[name] = hcpVal; else delete cfg.handicaps[name];
          });
          cfg.teams[k].players = players;
        });
        if(dupe) return alert('Two players are both named "'+dupe+'" — give each player a unique name before saving.');
        removedNames.forEach(function(n){ if(!renameMap[n]) delete cfg.handicaps[n]; });

        var doSave = function(){
          live.config = cfg;
          render();
          adminCall('saveConfig', [adminPin, cfg], function(){
            applyRosterRenamesToMatches(adminPin, renameMap, removedNames, function(){
              toast('Roster saved');
            });
          });
        };
        if(removedNames.length){
          var inUse = removedNames.filter(function(n){
            return matchList().some(function(m){ return (m.teamA||[]).concat(m.teamB||[]).indexOf(n)!==-1; });
          });
          if(inUse.length && !confirm('Remove '+inUse.join(', ')+' from the roster? They’ll also be pulled from their pairing(s).')) return;
        }
        doSave();
      });
    });
    var changePinBtn = document.getElementById('change-pin-btn');
    if(changePinBtn){
      changePinBtn.addEventListener('click', function(){
        var oldPin = document.getElementById('pin-old').value;
        var newPin = document.getElementById('pin-new').value;
        var msg = document.getElementById('change-pin-msg');
        changeAdminPin(oldPin, newPin, function(){
          adminPin = newPin;
          try{ sessionStorage.setItem('bc_admin_pin', newPin); }catch(e){}
          msg.style.color = '#8fe0bb';
          msg.textContent = 'PIN updated.';
        }, function(err){
          msg.style.color = '#ff8b98';
          msg.textContent = (err && err.message) || 'Could not update PIN.';
        });
      });
    }
  }
}

/* ---------- boot ---------- */
Router.init();
loadState();
setInterval(loadState, 8000);

/* Realtime: push updates to every open tab the instant any user saves a
   match (score entry or admin pairing change), instead of waiting up to
   8s for the poll. This has no equivalent in the old Apps Script version. */
try{
  sb.channel('matches-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, function(){
      loadState();
    })
    .subscribe();
}catch(e){ /* realtime is a nice-to-have; the poll above still covers us */ }
})();
</script>
